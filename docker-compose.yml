services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      # the directory, not the file: git replaces files on deploy and a single-file bind mount
      # would keep showing the old one
      - ./deploy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  # Optional forward proxy for Telegram bots / Claude Code on other machines.
  # Enable with: docker compose --profile proxy up -d   (see README -> Прокси)
  proxy:
    image: gogost/gost:latest
    restart: unless-stopped
    profiles: ["proxy"]
    command: >
      -L "http://${PROXY_USER}:${PROXY_PASS}@:8118"
      -L "socks5://${PROXY_USER}:${PROXY_PASS}@:1080"
      -L "https://${PROXY_USER}:${PROXY_PASS}@:8443?certFile=/certs/${APP_DOMAIN}/${APP_DOMAIN}.crt&keyFile=/certs/${APP_DOMAIN}/${APP_DOMAIN}.key"
    ports:
      - "8118:8118"
      - "1080:1080"
      - "8443:8443"
    volumes:
      - type: volume
        source: caddy_data
        target: /certs
        read_only: true
        volume:
          subpath: caddy/certificates/acme-v02.api.letsencrypt.org-directory
    depends_on:
      - caddy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
