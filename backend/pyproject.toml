[project]
name = "personal-dash-backend"
version = "0.1.0"
description = "Personal dashboard backend: tasks, balances, push, Telegram, Google Calendar, YouGile"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "apscheduler>=3.10,<4",
    "pywebpush>=2.0",
    "aiogram>=3.10",
    "anthropic>=0.40",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.130",
    "jsonpath-ng>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "aiosqlite>=0.20"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP017", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
